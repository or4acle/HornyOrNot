name: Update Badge

on:
  push:
    branches: [main]
    paths:
      - 'config.json'
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Generate badge
        run: python generate.py
        
      - name: Commit badge
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add badge.svg
          git diff --staged --quiet || git commit -m "Update badge"
          git push